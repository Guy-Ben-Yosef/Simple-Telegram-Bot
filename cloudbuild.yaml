# cloudbuild.yaml
steps:
  - name: 'python:3.11'
    id: 'install-deps'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install --upgrade pip
        pip install -r requirements.txt
  # 1. Build container image with a unique tag (the commit SHA)
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/telegram-bot:$SHORT_SHA', '.']

  # 2. Push the uniquely tagged image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/telegram-bot:$SHORT_SHA']

  # 3. Deploy the new, uniquely tagged image
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:485.0.0-slim'
    entrypoint: gcloud
    args:
      [
        'run', 'deploy', 'simple-telegram-bot',
        '--image', 'gcr.io/$PROJECT_ID/telegram-bot:$SHORT_SHA',
        '--region', 'us-central1',
        '--allow-unauthenticated',
        '--update-secrets', 'BOT_TOKEN=BOT_TOKEN:latest'
      ]

images:
  - 'gcr.io/$PROJECT_ID/telegram-bot:$SHORT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
